name: Build and Release APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Step 2: Setup Java
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      # Step 3: Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          
      # Step 4: Get Flutter dependencies
      - name: Get dependencies
        run: flutter pub get
        
      # Step 5: Analyze code
      - name: Analyze code
        run: flutter analyze
        
      # Step 6: Build Parent APK
      - name: Build Parent APK
        run: flutter build apk --flavor parent --release
        
      # Step 7: Build Child APK
      - name: Build Child APK
        run: flutter build apk --flavor child --release
        
      # Step 8: Upload Parent APK as artifact
      - name: Upload Parent APK
        uses: actions/upload-artifact@v3
        with:
          name: app-parent-release
          path: build/app/outputs/apk/parent/release/app-parent-release.apk
          retention-days: 30
          
      # Step 9: Upload Child APK as artifact
      - name: Upload Child APK
        uses: actions/upload-artifact@v3
        with:
          name: app-child-release
          path: build/app/outputs/apk/child/release/app-child-release.apk
          retention-days: 30
          
      # Step 10: Create Release (only on tags)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
          
      # Step 11: Upload Parent APK to Release
      - name: Upload Parent APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/app/outputs/apk/parent/release/app-parent-release.apk
          asset_name: camera-parent-${{ github.ref }}.apk
          asset_content_type: application/vnd.android.package-archive
          
      # Step 12: Upload Child APK to Release
      - name: Upload Child APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/app/outputs/apk/child/release/app-child-release.apk
          asset_name: camera-child-${{ github.ref }}.apk
          asset_content_type: application/vnd.android.package-archive
