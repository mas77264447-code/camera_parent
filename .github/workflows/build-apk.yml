name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, production-merge, fix/audit-2026-10, build-v2-0-0, test/camera-bg]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-parent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Verify google-services.json
        run: |
          test -f android/app/google-services.json || (echo "google-services.json missing!" && exit 1)
          echo "google-services.json present"

      - run: flutter pub get
      - run: flutter clean
      - run: flutter build apk --release --flavor parent --dart-define=IS_CHILD_BUILD=false

      - name: Upload parent APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-parent-release.apk
          tag_name: build-${{ github.run_number }}-parent
          name: Build ${{ github.run_number }} - Parent
          draft: false
          prerelease: false

  build-child:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Verify google-services.json
        run: |
          test -f android/app/google-services.json || (echo "google-services.json missing!" && exit 1)
          echo "google-services.json present"

      - run: flutter pub get
      - run: flutter clean
      - run: flutter build apk --release --flavor child --dart-define=IS_CHILD_BUILD=true

      - name: Upload child APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-child-release.apk
          tag_name: build-${{ github.run_number }}-child
          name: Build ${{ github.run_number }} - Child
          draft: false
          prerelease: false
