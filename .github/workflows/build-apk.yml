name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, production-merge, build-backup-before-fixes, fix/audit-2026-10]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-parent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Verify google-services.json
        run: |
          test -f android/app/google-services.json || (echo "google-services.json missing!" && exit 1)
          echo "google-services.json present"

      - run: flutter pub get
      - run: flutter clean
      - run: flutter build apk --release --flavor parent --dart-define=IS_CHILD_BUILD=false

      - name: Upload parent APK to artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: parent-apk
          path: build/app/outputs/flutter-apk/app-parent-release.apk
          retention-days: 1
          if-no-files-found: warn

      - name: Upload parent APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-parent-release.apk
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          draft: false
          prerelease: false
          body: |
            Build ${{ github.run_number }} - ${{ github.sha }}
            Branch: ${{ github.ref_name }}

  build-child:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Verify google-services.json
        run: |
          test -f android/app/google-services.json || (echo "google-services.json missing!" && exit 1)
          echo "google-services.json present"

      - run: flutter pub get
      - run: flutter clean
      - run: flutter build apk --release --flavor child --dart-define=IS_CHILD_BUILD=true

      - name: Upload child APK to artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: child-apk
          path: build/app/outputs/flutter-apk/app-child-release.apk
          retention-days: 1
          if-no-files-found: warn

      - name: Upload child APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-child-release.apk
          tag_name: build-${{ github.run_number }}-child
          name: Build ${{ github.run_number }} - Child
          draft: false
          prerelease: false
          body: |
            Build ${{ github.run_number }} - Child APK
            Branch: ${{ github.ref_name }}
