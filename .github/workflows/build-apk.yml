name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

jobs:
  build-parent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify google-services.json
        run: |
          test -f android/app/google-services.json || (echo "❌ google-services.json missing!" && exit 1)
          echo "✅ google-services.json present"

      - run: flutter pub get

      - name: Reduce Gradle heap
        run: |
          sed -i 's/-Xmx8G/-Xmx3G/; s/MaxMetaspaceSize=4G/MaxMetaspaceSize=1G/' android/gradle.properties || true

      - run: flutter clean

      - name: Build parent APK
        run: flutter build apk --release --flavor parent --dart-define=IS_CHILD_BUILD=false

      - uses: actions/upload-artifact@v4
        with:
          name: camera-parent-apk
          path: build/app/outputs/flutter-apk/app-parent-release.apk
          retention-days: 30

  build-child:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify google-services.json
        run: |
          test -f android/app/google-services.json || (echo "❌ google-services.json missing!" && exit 1)
          echo "✅ google-services.json present"

      - run: flutter pub get

      - name: Reduce Gradle heap
        run: |
          sed -i 's/-Xmx8G/-Xmx3G/; s/MaxMetaspaceSize=4G/MaxMetaspaceSize=1G/' android/gradle.properties || true

      - run: flutter clean

      - name: Build child APK
        run: flutter build apk --release --flavor child --dart-define=IS_CHILD_BUILD=true

      - uses: actions/upload-artifact@v4
        with:
          name: camera-child-apk
          path: build/app/outputs/flutter-apk/app-child-release.apk
          retention-days: 30
