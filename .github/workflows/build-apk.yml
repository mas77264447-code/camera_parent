name: Build APK with WebRTC Fixes

on:
  workflow_dispatch:
  push:
    branches: [main, production-merge]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Verify google-services.json
        run: |
          test -f android/app/google-services.json || (echo "❌ google-services.json missing!" && exit 1)
          echo "✅ google-services.json present"

      # ✅ الترتيب الصحيح: clean ثم pub get
      - name: Clean and get dependencies
        run: |
          flutter clean
          flutter pub get

      # ✅ حفظ الـ APK خارج build/ حتى لا يُحذف
      - name: Create release output dir
        run: mkdir -p release-artifacts

      - name: Build parent APK
        run: flutter build apk --release --flavor parent --dart-define=IS_CHILD_BUILD=false

      - name: Save parent APK
        run: cp build/app/outputs/flutter-apk/app-parent-release.apk release-artifacts/camera-parent.apk

      - name: Build child APK
        run: flutter build apk --release --flavor child --dart-define=IS_CHILD_BUILD=true

      - name: Save child APK
        run: cp build/app/outputs/flutter-apk/app-child-release.apk release-artifacts/camera-child.apk

      - name: Verify artifacts
        run: ls -lah release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/camera-parent.apk
            release-artifacts/camera-child.apk
          tag_name: build-${{ github.run_number }}
          name: Release Build ${{ github.run_number }} - WebRTC Fixes Applied
          draft: false
          prerelease: false
          body: |
            # Build ${{ github.run_number }}

            ✅ **Fixes Applied:**
            - StreamForegroundService: 1500ms → 2500ms
            - WebRTC initialization improved

            **Download & Install:**
            - camera-parent.apk
            - camera-child.apk