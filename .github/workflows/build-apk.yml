name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-parent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - run: flutter pub get

      - name: Reduce Gradle heap for GitHub runner
        run: |
          sed -i 's/-Xmx8G/-Xmx3G/; s/MaxMetaspaceSize=4G/MaxMetaspaceSize=1G/' android/gradle.properties || true

      - run: flutter clean

      - run: flutter build apk --release --flavor parent --dart-define=IS_CHILD_BUILD=false

      - uses: actions/upload-artifact@v4
        with:
          name: camera-parent-app-apk
          path: build/app/outputs/flutter-apk/app-parent-release.apk
          retention-days: 30

  build-child:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - run: flutter pub get

      - name: Reduce Gradle heap for GitHub runner
        run: |
          sed -i 's/-Xmx8G/-Xmx3G/; s/MaxMetaspaceSize=4G/MaxMetaspaceSize=1G/' android/gradle.properties || true

      - run: flutter clean

      - run: flutter build apk --release --flavor child --dart-define=IS_CHILD_BUILD=true

      - uses: actions/upload-artifact@v4
        with:
          name: camera-child-app-apk
          path: build/app/outputs/flutter-apk/app-child-release.apk
          retention-days: 30
