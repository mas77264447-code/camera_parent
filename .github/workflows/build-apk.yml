name: Build APK with WebRTC Fixes

on:
  workflow_dispatch:
  push:
    branches: [main, production-merge]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-parent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply WebRTC Fixes
        run: |
          sed -i 's/}, 1500L)/}, 2500L)/g' android/app/src/main/kotlin/com/example/camera_parent/StreamForegroundService.kt
          echo "✅ Applied: StreamForegroundService 1500ms → 2500ms"
          grep -n "2500L" android/app/src/main/kotlin/com/example/camera_parent/StreamForegroundService.kt

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Verify google-services.json
        run: |
          test -f android/app/google-services.json || (echo "❌ google-services.json missing!" && exit 1)
          echo "✅ google-services.json present"

      - run: flutter pub get
      - run: flutter clean
      - run: flutter build apk --release --flavor parent --dart-define=IS_CHILD_BUILD=false

      - uses: actions/upload-artifact@v4
        with:
          name: camera-parent-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  build-child:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Verify google-services.json
        run: |
          test -f android/app/google-services.json || (echo "❌ google-services.json missing!" && exit 1)
          echo "✅ google-services.json present"

      - run: flutter pub get
      - run: flutter clean
      - run: flutter build apk --release --flavor child --dart-define=IS_CHILD_BUILD=true

      - uses: actions/upload-artifact@v4
        with:
          name: camera-child-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  create-release:
    needs: [build-parent, build-child]
    runs-on: ubuntu-latest
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-apks
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-apks/**/*.apk
          tag_name: build-${{ github.run_number }}
          name: Release Build ${{ github.run_number }} - WebRTC Fixes Applied
          draft: false
          prerelease: false
          body: |
            # Build ${{ github.run_number }}
            
            ✅ **Fixes Applied:**
            - StreamForegroundService: 1500ms → 2500ms
            - WebRTC initialization improved
            
            **Download & Install:**
            - app-parent-release.apk
            - app-child-release.apk